version: '3.8'

services:
  # Streamlit app service
  streamlit-app:
    build: .
    container_name: csv-analytics-dashboard
    ports:
      - "8501:8501"
    volumes:
      # Mount data directory for persistence
      - ./data:/app/data
      # Mount logs directory
      - ./logs:/app/logs
    environment:
      - OLLAMA_URL=http://ollama:11434
      - DATABASE_PATH=data/analytics.duckdb
      - LOG_LEVEL=INFO
      - PYTHONUNBUFFERED=1
    depends_on:
      - ollama
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Ollama LLM service
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - app-network
    restart: unless-stopped
    # Pull the model on container start (handled via init script)
    # Note: Model will be downloaded on first AI query if not present

volumes:
  ollama-data:
    driver: local

networks:
  app-network:
    driver: bridge

